<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cronache del Vento</title>
<style>
html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#c{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated;background:#000;touch-action:none}
#ctrl{position:fixed;left:0;right:0;bottom:0;pointer-events:none}
body.portrait #ctrl{background:linear-gradient(#141826,#0b0d14)}
.pad{position:absolute;pointer-events:auto;touch-action:none}
#joy{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18)}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,230,170,.35);border:2px solid rgba(255,230,170,.6)}
#dpad{width:138px;height:138px;display:none}
#dpad div{position:absolute;width:46px;height:46px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:8px;color:#fff8;font:20px sans-serif;display:flex;align-items:center;justify-content:center}
.btn{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:bold 24px system-ui;color:#fff;border:2px solid rgba(255,255,255,.35)}
#ba{background:rgba(200,60,60,.55)}
#bb{background:rgba(60,90,200,.55);width:56px;height:56px;font-size:20px}
body.land .pad{opacity:.55}
body.arrows #joy{display:none}
body.arrows #dpad{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ctrl">
  <div id="joy" class="pad"><div id="knob"></div></div>
  <div id="dpad" class="pad"><div data-d="up" style="left:46px;top:0">▲</div><div data-d="left" style="left:0;top:46px">◀</div><div data-d="right" style="left:92px;top:46px">▶</div><div data-d="down" style="left:46px;top:92px">▼</div></div>
  <div id="ba" class="pad btn">A</div>
  <div id="bb" class="pad btn">B</div>
</div>
<script>
'use strict';
/* ================= BASE ================= */
const W=256,H=224,TS=16,SAVEKEY='cronache-vento.save',OPTKEY='cronache-vento.opt';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SC=1,CSS=1,cvTop=0;
const OPT={fort:true,cook:true,sea:true,ter:true,dia:true,eco:true,pfx:false,txt:2,arrows:false,hd:true,snd:true,mus:true};
try{Object.assign(OPT,JSON.parse(localStorage.getItem(OPTKEY)||'{}'))}catch(e){}
function saveOpt(){try{localStorage.setItem(OPTKEY,JSON.stringify(OPT))}catch(e){}document.body.classList.toggle('arrows',!!OPT.arrows)}
function resize(){
  const vw=innerWidth,vh=innerHeight,portrait=vh>vw*1.05;
  document.body.classList.toggle('portrait',portrait);document.body.classList.toggle('land',!portrait);
  const ctrlH=portrait?Math.max(170,Math.min(260,vh-W*0+0-(vw/W)*H)):0;
  CSS=Math.min(vw/W,(vh-(portrait?170:0))/H);
  cv.style.width=W*CSS+'px';cv.style.height=H*CSS+'px';
  cvTop=portrait?0:(vh-H*CSS)/2;cv.style.top=cvTop+'px';
  SC=Math.max(1,Math.round(CSS*(devicePixelRatio||1)));cv.width=W*SC;cv.height=H*SC;
  const ctrl=document.getElementById('ctrl');
  const ch=portrait?vh-H*CSS:vh;ctrl.style.height=ch+'px';
  const cy=portrait?ch/2:ch-90;
  const j=document.getElementById('joy'),d=document.getElementById('dpad');
  j.style.left='18px';j.style.top=(cy-65)+'px';d.style.left='14px';d.style.top=(cy-69)+'px';
  const a=document.getElementById('ba'),b=document.getElementById('bb');
  a.style.right='22px';a.style.top=(cy-52)+'px';b.style.right='98px';b.style.top=(cy+4)+'px';
}
addEventListener('resize',resize);saveOpt();resize();
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hash(x,y){let h=(x*374761393+y*668265263)>>>0;h=(h^(h>>13))*1274126177>>>0;return h}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const m=v=>clamp(Math.round(f<0?v*(1+f):v+(255-v)*f),0,255);return'#'+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1)}
function outline(c,col='#120e18'){const g=c.getContext('2d'),d=g.getImageData(0,0,c.width,c.height),o=g.createImageData(c.width,c.height),w=c.width,h=c.height;
  const a=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d.data[(y*w+x)*4+3]>0;const n=parseInt(col.slice(1),16);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1))){const i=(y*w+x)*4;o.data[i]=n>>16;o.data[i+1]=n>>8&255;o.data[i+2]=n&255;o.data[i+3]=255}}
  const t=mk(w,h);t.getContext('2d').putImageData(o,0,0);g.drawImage(t,0,0);return c}

/* ================= INPUT ================= */
const IN={held:{},pressed:new Set(),joy:{x:0,y:0},tap:null,lastDir:null,rep:0};
const press=k=>IN.pressed.add(k);
const hit=k=>{if(IN.pressed.has(k)){IN.pressed.delete(k);sfx(k==='a'?'ok':k==='b'?'back':'move');return true}return false};
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Enter:'a',' ':'a',x:'b',Escape:'b',Backspace:'b'};
addEventListener('keydown',e=>{const k=KM[e.key];if(!k)return;e.preventDefault();if(k==='a'||k==='b'){if(!e.repeat)press(k)}else IN.held[k]=true});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)IN.held[k]=false});
(function(){const j=document.getElementById('joy'),kn=document.getElementById('knob');let id=null,cx=0,cy=0;
  const mv=e=>{for(const t of e.changedTouches||[e]){if((t.identifier??'m')!==id)continue;let dx=t.clientX-cx,dy=t.clientY-cy;const l=Math.hypot(dx,dy),m=45;if(l>m){dx*=m/l;dy*=m/l}kn.style.left=40+dx+'px';kn.style.top=40+dy+'px';IN.joy.x=Math.abs(dx)>14?Math.sign(dx)*(Math.abs(dx)/m):0;IN.joy.y=Math.abs(dy)>14?Math.sign(dy)*(Math.abs(dy)/m):0}e.preventDefault()};
  const up=e=>{for(const t of e.changedTouches||[e]){if((t.identifier??'m')!==id)continue;id=null;kn.style.left='40px';kn.style.top='40px';IN.joy.x=IN.joy.y=0}};
  j.addEventListener('touchstart',e=>{const t=e.changedTouches[0];id=t.identifier;const r=j.getBoundingClientRect();cx=r.left+65;cy=r.top+65;mv(e)},{passive:false});
  j.addEventListener('touchmove',mv,{passive:false});j.addEventListener('touchend',up);j.addEventListener('touchcancel',up);
  j.addEventListener('mousedown',e=>{id='m';const r=j.getBoundingClientRect();cx=r.left+65;cy=r.top+65;mv(e)});addEventListener('mousemove',e=>{if(id==='m')mv(e)});addEventListener('mouseup',e=>{if(id==='m')up(e)});
  document.querySelectorAll('#dpad div').forEach(el=>{const d=el.dataset.d;const on=e=>{e.preventDefault();IN.held[d]=true},off=e=>{IN.held[d]=false};el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off)});
  for(const [idb,k] of [['ba','a'],['bb','b']]){const el=document.getElementById(idb);const f=e=>{e.preventDefault();press(k);el.style.filter='brightness(1.6)';setTimeout(()=>el.style.filter='',120)};el.addEventListener('touchstart',f,{passive:false});el.addEventListener('mousedown',f)}
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();IN.tap={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};e.preventDefault()});
})();
function dirHeld(){const h=IN.held;let x=(h.right?1:0)-(h.left?1:0)+IN.joy.x,y=(h.down?1:0)-(h.up?1:0)+IN.joy.y;if(!x&&!y)return null;return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up')}
function inputTick(dt){const d=dirHeld();if(d!==IN.lastDir){if(d)press(d);IN.rep=.32;IN.lastDir=d}else if(d){IN.rep-=dt;if(IN.rep<=0){press(d);IN.rep=.11}}}
function takeTap(x,y,w,h){const t=IN.tap;if(t&&t.x>=x&&t.x<x+w&&t.y>=y&&t.y<y+h){IN.tap=null;return true}return false}

/* ================= TILES ================= */
const SOLID=new Set('To#~wHWDRrFCLBsXxgvkeqtY aKG'.split(''));SOLID.delete('');
const ANIM=new Set(['~','w','C','L','a']);
const TCACHE={};
function paintTile(ch,v,f){
  const c=mk(16,16),g=c.getContext('2d'),r=rng(hash(v*31+7,ch.charCodeAt(0)*13+1));
  const P=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  const grass=(b='#3f7a3a',d1='#4d8c44',d2='#33682f')=>{P(0,0,16,16,b);for(let i=0;i<20;i++)P(r()*16|0,r()*16|0,1,r()<.4?2:1,r()<.5?d1:d2)};
  const stone=(b,m)=>{P(0,0,16,16,m);for(let row=0;row<4;row++){const off=row%2?4:0;for(let i=-1;i<3;i++){const x=i*8+off,y=row*4;P(x+1,y+1,7,3,shade(b,(r()-.5)*.18));P(x+1,y+1,7,1,shade(b,.15))}}};
  const flag=(b)=>{P(0,0,16,16,shade(b,-.25));for(const [x,y,w,h] of [[1,1,7,6],[9,1,6,6],[1,8,5,7],[7,8,8,7]]){P(x,y,w,h,shade(b,(r()-.5)*.15));P(x,y,w,1,shade(b,.12))}};
  switch(ch){
  case '.':grass();break;
  case 'n':grass('#2f5a2c','#3a6b35','#264a24');break;
  case ',':grass();for(let i=0;i<4;i++){const x=1+r()*13|0,y=1+r()*13|0,cs=['#e8d26a','#e86a6a','#f2f2f2','#c79af0'];P(x,y,2,2,cs[r()*4|0]);P(x,y+2,1,1,'#2c5a28')}break;
  case 'p':P(0,0,16,16,'#8a6b45');for(let i=0;i<14;i++)P(r()*16|0,r()*16|0,r()<.3?2:1,1,r()<.5?'#a0805a':'#6e5236');break;
  case 'T':grass('#2f5a2c','#3a6b35','#264a24');P(6,11,4,5,'#5a3b22');P(7,11,1,5,'#74502f');g.fillStyle='#1d3d1e';g.beginPath();g.arc(8,7,7.5,0,7);g.fill();g.fillStyle='#2b5a2a';g.beginPath();g.arc(8,6.5,6.5,0,7);g.fill();g.fillStyle='#3d7a35';g.beginPath();g.arc(6.5,5,4,0,7);g.fill();g.fillStyle='#5a9a48';g.beginPath();g.arc(5.5,3.8,1.8,0,7);g.fill();for(let i=0;i<5;i++)P(3+r()*10|0,3+r()*8|0,1,1,'#6aae55');break;
  case 'o':grass();g.fillStyle='#55525c';g.beginPath();g.ellipse(8,10,6,4.5,0,0,7);g.fill();g.fillStyle='#7d7a86';g.beginPath();g.ellipse(7,9,4.5,3,0,0,7);g.fill();P(5,7,3,1,'#a4a1ac');break;
  case '#':stone('#6c6874','#3f3c47');break;
  case 'v':stone('#6a6870','#3a3842');for(let i=0;i<8;i++)P(r()*16|0,r()*16|0,2,1,'#4f7a3a');P(0,0,16,2,'#3a3842');for(let x=0;x<16;x+=3)P(x,0,2,1+(r()*3|0),'#2a2832');break;
  case '=':flag('#7d7680');break;
  case 'm':flag('#6f7468');for(let i=0;i<6;i++)P(r()*16|0,r()*16|0,2,1,'#557a3e');break;
  case 'c':P(0,0,16,16,'#8e2a2a');P(0,0,16,1,'#a83a34');for(let y=2;y<16;y+=5)for(let x=(y%2)*4;x<16;x+=8)P(x+2,y,2,2,'#c99a3a');break;
  case 'q':flag('#a7a2a8');P(0,14,16,2,'#57535c');break;
  case '~':{P(0,0,16,16,'#2e5f9a');for(let y=2;y<16;y+=5){const o=(f*2+y*3+v)%16;P(o,y,5,1,'#5a8fcf');P((o+9)%16,y+2,3,1,'#3f74b4')}break}
  case 'w':{P(0,0,16,16,'#30473a');for(let y=1;y<16;y+=5){const o=(f*2+y*5+v)%16;P(o,y,4,1,'#4f6e55');P((o+8)%16,y+2,2,1,'#3d5a46')}break}
  case 'b':P(0,0,16,16,'#3a2616');for(let x=0;x<16;x+=4){P(x,0,3,16,shade('#8a5a32',(r()-.5)*.2));P(x,0,3,1,'#a87a4a')}P(0,0,16,1,'#5a3b22');P(0,15,16,1,'#5a3b22');break;
  case 'H':P(0,0,16,16,'#d8c9a8');P(0,0,16,2,'#5a3b22');P(0,14,16,2,'#7a6a52');P(0,0,2,16,'#5a3b22');P(14,0,2,16,'#5a3b22');for(let i=0;i<5;i++)P(3+r()*10|0,3+r()*10|0,1,1,'#c7b794');break;
  case 'W':P(0,0,16,16,'#d8c9a8');P(0,0,16,2,'#5a3b22');P(0,14,16,2,'#7a6a52');P(4,4,8,8,'#3a2616');P(5,5,6,6,'#ffd86b');P(5,5,6,1,'#fff0b0');P(7,5,1,6,'#3a2616');P(5,8,6,1,'#3a2616');break;
  case 'D':P(0,0,16,16,'#d8c9a8');P(2,2,12,14,'#3a2616');P(3,3,10,13,'#6b4226');for(let x=3;x<13;x+=3)P(x,3,1,13,'#4f2f1a');P(11,9,1,2,'#e8c86a');break;
  case 'R':case 'r':{const a=ch==='R'?'#9c3b2e':'#3d4e6e',b=ch==='R'?'#7a2c22':'#2c3a55',h=ch==='R'?'#c0584a':'#5a6e92';P(0,0,16,16,b);for(let y=0;y<16;y+=4){const o=(y/4)%2?4:0;for(let x=-4;x<16;x+=8){P(x+o,y,7,3,a);P(x+o,y,7,1,h)}}break}
  case 'F':grass();P(0,6,16,2,'#8a6a42');P(0,10,16,2,'#8a6a42');P(2,4,2,10,'#6b4f30');P(12,4,2,10,'#6b4f30');break;
  case 'C':{stone('#6c6874','#3f3c47');P(7,8,2,6,'#3a2616');P(5,7,6,2,'#5a5a5a');const fl=[0,1,2,1][f];P(6,2+fl,4,5-fl,'#ff9a2a');P(7,1+fl,2,4,'#ffd86b');P(7,0+fl,1,2,'#fff4c0');break}
  case 'L':{flag('#7d7680');P(7,6,2,10,'#2a2830');P(5,14,6,2,'#2a2830');const gl=['#ffd36b','#ffe08a','#ffcf5a','#ffe9a8'][f];P(4,0,8,7,'#2a2830');P(5,1,6,5,gl);P(5,1,6,1,'#fff6d0');break}
  case 'a':{grass('#2f5a2c','#3a6b35','#264a24');P(3,11,10,3,'#5a3b22');P(4,10,8,2,'#3a2616');const fl=[0,1,2,1][f];P(5,4+fl,6,7-fl,'#ff7a1a');P(6,3+fl,4,6-fl,'#ffb43a');P(7,2+fl,2,4,'#fff0a0');break}
  case 'B':flag('#7d7680');P(0,0,16,2,'#2a2830');for(let x=1;x<16;x+=4){P(x,0,2,16,'#3a3a44');P(x,0,1,16,'#6a6a78')}break;
  case 'S':flag('#4a4f44');for(let i=0;i<4;i++)P(r()*16|0,r()*16|0,2,1,'#5d6a58');break;
  case 's':stone('#3f443b','#272a24');for(let i=0;i<3;i++){const x=r()*16|0;P(x,8,1,4+(r()*4|0),'#4a6a3a')}break;
  case 'h':flag('#7d7680');P(2,5,12,8,'#c9a34a');for(let i=0;i<10;i++)P(2+r()*12|0,5+r()*8|0,2,1,'#e0c070');break;
  case 'X':case 'x':flag('#7d7680');P(2,5,12,10,'#6b4226');P(2,5,12,2,ch==='X'?'#8a5a32':'#2a1a10');P(2,9,12,1,'#c9a34a');P(7,8,2,3,'#e8c86a');if(ch==='x')P(3,3,10,3,'#8a5a32');break;
  case 'g':P(0,0,16,16,'#3f3c47');P(1,1,14,15,'#4a3020');for(let x=1;x<15;x+=3)P(x,1,1,15,'#2a1a10');P(1,5,14,2,'#5a5a66');P(1,11,14,2,'#5a5a66');break;
  case 'k':flag('#6f7468');P(7,0,2,16,'#8a8a96');P(7,0,1,16,'#c0c0cc');P(5,14,6,2,'#4a4850');break;
  case 'e':P(0,0,16,16,'#5e544b');for(let y=0;y<16;y+=4)P(0,y+(v%2),16,1,'#4a423a');for(let i=0;i<6;i++)P(r()*16|0,r()*16|0,2,1,'#7a6e62');break;
  case 'Z':flag('#4a4f44');P(3,3,10,10,'#0e0e12');for(let y=4;y<13;y+=3)P(4,y,8,1,'#6b4226');break;
  case 'K':stone('#8a8494','#4a4652');P(0,0,16,1,'#a8a4b0');break;
  case 'G':flag('#7d7680');P(2,1,2,15,'#5a3b22');P(12,1,2,15,'#5a3b22');P(1,1,14,2,'#6b4226');P(7,3,1,6,'#c9a34a');P(6,9,3,2,'#c9a34a');break;
  case 'Y':stone('#6c6874','#3f3c47');P(4,1,8,13,'#2f4f8a');P(4,1,8,1,'#c9a34a');P(5,12,2,3,'#2f4f8a');P(9,12,2,3,'#2f4f8a');P(6,5,4,2,'#e8e8f0');P(5,4,2,1,'#e8e8f0');P(9,4,2,1,'#e8e8f0');break;
  case 't':flag('#7d7680');P(1,4,14,8,'#8a5a32');P(1,4,14,2,'#a87a4a');P(2,12,2,3,'#5a3b22');P(12,12,2,3,'#5a3b22');P(4,3,3,2,'#e0d0a0');P(9,2,4,3,'#c0584a');break;
  default:P(0,0,16,16,'#000');
  }
  return c}
function tileImg(ch,x,y,t){const v=hash(x,y)%3,f=ANIM.has(ch)?(Math.floor(t*(ch==='C'||ch==='L'||ch==='a'?8:3))%4):0;const k=ch+v+'_'+f;return TCACHE[k]||(TCACHE[k]=paintTile(ch,v,f))}

/* ================= SPRITES ================= */
const LOOKS={
 leo:{skin:'#f0c8a0',hair:'#5a3a22',hs:'short',body:'#2f4f8a',body2:'#c9a34a',legs:'#3a2a1a'},
 leo0:{skin:'#f0c8a0',hair:'#5a3a22',hs:'short',body:'#2f4f8a',body2:'#c9a34a',legs:'#3a2a1a'},
 nina:{skin:'#e8b890',hair:'#2a2030',hs:'tail',body:'#6a2a3a',body2:'#3a1a22',legs:'#2a2030'},
 bruno:{skin:'#e0a880',hair:'#7a6a5a',hs:'tonsure',body:'#7a5a3a',body2:'#e8e0c8',legs:'#4a3a2a',beard:1},
 tancredi:{skin:'#e8bc98',hair:'#9a9aa2',hs:'short',body:'#5a6a7a',body2:'#c9a34a',legs:'#3a3a44',beard:1,scar:1},
 guard:{skin:'#e8bc98',hair:'#4a3a2a',hs:'helmet',body:'#2f4f8a',body2:'#9a9aa2',legs:'#2a2a30'},

let G=null;
function newGame(hero){G={hero,map:'palazzo',x:19,y:22,dir:3,party:['leo'],ch:{},inv:{pane:2},gold:40,flags:{},hearts:{nina:0,bruno:0,tancredi:0},stars:['leo'],steps:0,play:0,chapter:'Prologo'};applyHero();joinChar('leo',3)}
function statsOf(id,lv){const d=CH[id],o={};for(const k in d.base)o[k]=Math.round(d.base[k]+d.gr[k]*(lv-1));return o}
function joinChar(id,lv){if(!G.ch[id]){if(G.ngLv&&id!=='leo')lv=Math.max(lv,G.ngLv-3);const s=statsOf(id,lv);G.ch[id]={lv,exp:0,hp:s.hp,pm:s.pm,row:id==='nina'||id==='bruno'||id==='viola'||id==='melina'?'B':'F'}}if(!G.party.includes(id)){if(G.party.length<6)G.party.push(id);else{G.reserve=G.reserve||[];if(!G.reserve.includes(id))G.reserve.push(id)}}}
function fixRows(){for(const r of ['F','B']){const L=G.party.filter(p=>G.ch[p].row===r);while(L.length>3){const p=L.pop();G.ch[p].row=r==='F'?'B':'F'}}}
function cstat(id){const c=G.ch[id],s=statsOf(id,c.lv);if(id==='leo'&&!G.flags.sword)s.atk-=6;s.atk+=3*(G.wpn||0)+2*fortLv('fucina')+3*(G.sec||0);s.def+=2*(G.sec||0);return s}
const expNext=lv=>lv*lv*7+14;
function addItem(id,n){G.inv[id]=(G.inv[id]||0)+n;if(G.inv[id]<=0)delete G.inv[id]}
function healAll(){for(const id of G.party){const s=cstat(id);G.ch[id].hp=s.hp;G.ch[id].pm=s.pm}}
function saveGame(slot = (window.activeSlot||0)){try{window.activeSlot=slot;const data={G,time:Date.now(),chapter:G.chapter||'Prologo',lv:G.ch.leo?G.ch.leo.lv:1};localStorage.setItem('cronache-vento.slot'+slot,JSON.stringify(data));localStorage.setItem('cronache-vento.active',slot);localStorage.setItem(SAVEKEY,JSON.stringify(G));window.autoSaveTimer=2.5;return true}catch(e){return false}}
function loadGame(slot = (window.activeSlot||0)){try{window.activeSlot=slot;const raw=localStorage.getItem('cronache-vento.slot'+slot);if(raw){const d=JSON.parse(raw);if(d&&d.G&&d.G.ch)return d.G}const d=JSON.parse(localStorage.getItem(SAVEKEY));if(d&&d.ch)return d}catch(e){}return null}

/* ================= MAPS ================= */
function grid(w,h,ch){return Array.from({length:h},()=>Array(w).fill(ch))}
function R(g,x,y,w,h,ch){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(g[j]&&i>=0&&i<g[0].length)g[j][i]=ch}
function S(g,x,y,ch){if(g[y]&&x>=0&&x<g[0].length)g[y][x]=ch}
function house(g,x,y,w,h,roof='R',door=1){R(g,x,y,w,h-1,roof);R(g,x,y+h-1,w,1,'H');for(let i=x+1;i<x+w-1;i+=2)S(g,i,y+h-1,'W');if(door)S(g,x+(w>>1),y+h-1,'D')}
function scatter(g,ch,on,n,seed){const r=rng(seed);for(let k=0;k<n;k++){const x=r()*g[0].length|0,y=r()*g.length|0;if(g[y][x]===on)g[y][x]=ch}}

function patrolTick(dt){for(const n of M.npcs){if(!n.patrol)continue;n.pt=(n.pt||0)+dt;if(n.pt>=.55){n.pt=0;n.pi=n.pi||0;const [tx,ty]=n.patrol[n.pi];if(n.x===tx&&n.y===ty){n.pi=(n.pi+1)%n.patrol.length}else{const dx=Math.sign(tx-n.x),dy=dx?0:Math.sign(ty-n.y);n.dir=dx>0?2:dx<0?1:dy>0?0:3;const nx=n.x+dx,ny=n.y+dy;if(!(nx===G.x&&ny===G.y)&&!SOLID.has(M.g[ny][nx])){n.x=nx;n.y=ny;n.px=nx*16;n.py=ny*16}}}
  if(seen(n)){run(()=>caught(n));return}}}
function seen(n){const [dx,dy]=DV[n.dir];for(let d=1;d<=3;d++){const x=n.x+dx*d,y=n.y+dy*d;if(y<0||x<0||y>=M.h||x>=M.w||SOLID.has(M.g[y][x]))return false;if(x===G.x&&y===G.y)return true}return false}
async function caught(n){flash=.4;await say('guard','Ehi! Tu! Il coprifuoco vale anche per i regicidi!');const r=await battle(['ronda','ronda'],{bg:'festa'});if(r==='win'){G.tmpKo=G.tmpKo||{};G.tmpKo[n.id]=1;M.npcs=M.npcs.filter(x=>x!==n)}}
async function stealthHit(n){const behind=n.dir===G.dir;if(behind&&G.party.includes('nina')){G.tmpKo=G.tmpKo||{};G.tmpKo[n.id]=1;M.npcs=M.npcs.filter(x=>x!==n);await say('nina','Shh. Dorme. Si sveglierà con un gran mal di testa e una storia da non raccontare.');return}n.dir=[3,2,1,0][G.dir];await caught(n)}

async function pathActions(n){const pa=PA[n.id];if(!pa)return;const ks=Object.keys(pa).filter(k=>G.party.includes(PA_WHO[k])&&!G.flags['pa_'+n.id+'_'+k]);if(!ks.length)return;
  const lbl=ks.map(k=>{if(k==='ruba'){const p=stealP(pa.ruba);return PA_LBL[k]+' ('+Math.round(p*100)+'%)'}return PA_LBL[k].replace('Convinci',CH.leo.name+': Convinci')});
  const c=await ask('Azione sul campo con '+(n.name||'')+'?',lbl.concat(['Niente']));if(c>=ks.length)return;const k=ks[c];G.flags['pa_'+n.id+'_'+k]=1;
  if(k==='ruba'){const r=pa.ruba;if(Math.random()<stealP(r)){addItem(r.item,1);await say(null,r.ok);await toast('Rubato: '+ITEMS[r.item].n);if(r.after)await r.after()}else{G.fama=(G.fama||0)-1;await say(null,r.ko)}}
  else if(k==='indaga'){await say('bruno',pa.indaga.t);if(pa.indaga.after)await pa.indaga.after()}
  else if(k==='sfida'){const r=await battle(pa.sfida.foes,{bg:M.d.bg});if(r==='win'&&pa.sfida.win)await pa.sfida.win()}
  else if(k==='convinci'){if(pa.convinci.need&&(G.fama||0)<pa.convinci.need){delete G.flags['pa_'+n.id+'_'+k];await say(null,pa.convinci.no+' (Fama: '+(G.fama||0)+')');return}await pa.convinci.t();G.fama=(G.fama||0)+1}}
function stealP(r){const lv=G.ch.nina?G.ch.nina.lv:1;return clamp(.4+(lv-r.lv)*.08,.1,.92)}

const MOSSE=['Attacco','Difesa','Colpo pieno'];const BEATS={0:2,2:1,1:0};// Attacco batte Colpo pieno, Colpo pieno batte Difesa, Difesa batte Attacco
function duel(foe,lines){return new Promise(async res=>{let won=0,lost=0;for(let r=0;r<lines.length&&won<3&&lost<3;r++){const [line,move]=lines[r];
   await say(foe,line);const c=await ask('Cosa fai?',MOSSE,'leo');let out;if(c===move)out=0;else if(BEATS[c]===move)out=1;else out=-1;
   flash=.6;camShake=3;setTimeout(()=>camShake=0,200);await wait(300);
   if(out===1){won++;await toast('Colpo a segno! ('+won+' a '+lost+')')}else if(out===-1){lost++;await toast('Tancredi ti legge come un libro. ('+won+' a '+lost+')')}else await toast('Lame incrociate. Nessuno cede.')}
  res({won,lost})})}

function pkNext(u){u.t=0;u.msg='';u.ball=null;u.dz=null;
  const kicks=u.hist.filter(h=>h.k).length,keeps=u.hist.filter(h=>!h.k).length;
  if(kicks<=keeps&&kicks<5||(kicks>=5&&kicks===keeps&&u.sc[0]===u.sc[1])){u.role='kick';u.phase='aim'}
  else if(kicks>keeps){u.role='keep';u.phase='dive'}
  if(kicks===keeps&&kicks>=5&&u.sc[0]!==u.sc[1]){u.done=true}
  // early finish
  const kl=5-Math.min(5,kicks),pl=5-Math.min(5,keeps);if(kicks<=5&&keeps<=5&&(u.sc[0]>u.sc[1]+pl||u.sc[1]>u.sc[0]+kl))u.done=true}
function pkUpdate(u,dt){u.t+=dt;if(u.done){if(u.t>1.2||hit('a')||IN.tap){IN.tap=null;ui.pop();u.res({win:u.sc[0]>u.sc[1],sc:u.sc.slice()})}return}
  let A=hit('a');let tx=null;if(IN.tap){tx=IN.tap.x;IN.tap=null;A=true}
  const stars=G.stars.length,tier=PKT[u.tier];
  if(u.role==='kick'){
    if(u.phase==='aim'){u.aim=.5+.5*Math.sin(u.t*(2.3+u.tier*.5));if(A){u.lock=u.aim;u.phase='power';u.t=0}}
    else if(u.phase==='power'){u.pow=.5+.5*Math.sin(u.t*3.4-1.57);if(A){const aim=u.lock,pw=u.pow;const zone=aim<.34?0:aim<.66?1:2;
        let dz=Math.random()<.18+tier.sk+Math.min(.1,stars*.002)?zone:(Math.random()*3|0);
        const wide=aim<.04||aim>.96,over=pw>.96;let goal=true;
        if(wide||over)goal=false;else if(dz===zone){const edge=aim<.14||aim>.86;goal=pw<.3?false:(pw>.6&&edge?Math.random()<.65:Math.random()<(pw>.7?.3:.1))}
        u.res2={goal,dz,zone,wide,over,aim,pw};u.phase='shot';u.t=0;u.sz=zone;u.ksz=dz}}
    else if(u.phase==='shot'){if(u.t>.9){const r=u.res2;u.msg=r.goal?'GOL!':r.wide||r.over?'FUORI!':'PARATO!';if(r.goal)u.sc[0]++;u.hist.push({k:true,g:r.goal});u.phase='result';u.t=0}}
    else if(u.phase==='result'){if(u.t>1.1)pkNext(u)}}
  else{
    if(u.phase==='dive'){let d=null;if(hit('left'))d=0;else if(hit('right'))d=2;else if(hit('up')||hit('down'))d=1;if(tx!=null)d=tx<W/3?0:tx>W*2/3?2:1;
      if(d!=null||u.t>3){if(d==null)d=1;const w=[.36,.28,.36];let z=0,r=Math.random()*1,acc=0;for(z=0;z<3;z++){acc+=w[z];if(r<acc)break}z=Math.min(2,z);const miss=Math.random()<.16-tier.sk*.2;
        let save=!miss&&d===z&&Math.random()<(d===1?.62:.8)+Math.min(.12,stars*.004);if(miss){save=true}u.res2={goal:!save,zone:z,miss};u.dz=d;u.sz=z;u.ksz=d;u.phase='shot';u.t=0}}
    else if(u.phase==='shot'){if(u.t>.9){const r=u.res2;u.msg=r.miss?'FUORI! Hanno sbagliato':r.goal?'GOL DEGLI AVVERSARI':'PARATA!';if(r.goal)u.sc[1]++;u.hist.push({k:false,g:r.goal});u.phase='result';u.t=0}}
    else if(u.phase==='result'){if(u.t>1.1)pkNext(u)}}
}
